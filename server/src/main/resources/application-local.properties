# 로컬 개발: H2 파일 DB를 PostgreSQL 모드로(같은 마이그레이션 SQL을 RDS 에도 그대로 씀).
spring.datasource.url=jdbc:h2:file:./data/tokcar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# 가계정(local 프로필에서만 만들어짐). 테스트용 비밀번호이고 실제 서비스에 쓰지 않는다.
tokcar.seed.papa-password=papa1234!
tokcar.seed.minji-password=minji1234!
# 가짜 친구들(엄마 mom1, 어머니 mother, 누나 nuna, 철수 chul, 영호 young, 민석 minsuk, 종민 jong, 김 팀장 kim, 박 대리 park, 민지 친구 수진 sujin · 지우 jiwoo · 하은 haeun) 공통
tokcar.seed.extra-password=family1234!
