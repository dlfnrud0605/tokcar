spring.application.name=tokcar-server
# 기본은 로컬(H2). AWS 에서는 SPRING_PROFILES_ACTIVE=prod 로 켠다.
spring.profiles.default=local
server.port=8080

spring.jpa.open-in-view=false
# 테이블은 Flyway(db/migration)가 만들고, JPA 는 엔티티와 맞는지만 확인한다.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# 네이버 지도 API 중계(geo/NaverProxyController). 비밀 키는 파일에 쓰지 않는다:
# 환경 변수(NAVER_MAP_CLIENT_ID · NAVER_MAP_CLIENT_SECRET · NAVER_SEARCH_ID · NAVER_SEARCH_SECRET) 또는 올리지 않는 secrets.properties 로 넣는다.
naver.maps.base-url=https://maps.apigw.ntruss.com
naver.search.base-url=https://naverapihub.apigw.ntruss.com
naver.maps.client-id=${NAVER_MAP_CLIENT_ID:}
naver.maps.client-secret=${NAVER_MAP_CLIENT_SECRET:}
naver.search.client-id=${NAVER_SEARCH_ID:}
naver.search.client-secret=${NAVER_SEARCH_SECRET:}
spring.config.import=optional:file:./secrets.properties
